<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>快速排座位</title>
    <style>
        body {
            font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #f4f4f2;
            margin: 0;
            padding: 20px;
            color: #333;
            font-size: 18px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #555;
            font-weight: bold;
        }
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .student-list, .seat-area {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        .student-list {
            width: 300px;
            max-height: 650px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .student {
            border-radius: 6px;
            padding: 8px;
            margin: 6px 0;
            text-align: center;
            cursor: grab;
            user-select: none;
            font-weight: bold;
            font-size: 18px;
            transition: background-color 0.2s;
        }
        .male {
            background-color: #add8e6;
        }
        .female {
            background-color: #f6c1c1;
        }
        .student:active {
            cursor: grabbing;
        }
        .seat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 600px;
        }
        .seat-config {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .seat-config input {
            width: 50px;
            text-align: center;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .seat-config button {
            padding: 5px 10px;
        }
        table {
            border-collapse: separate;
            border-spacing: 6px;
        }
        td {
            width: 100px;
            height: 60px;
            border: 1px dashed #bbb;
            border-radius: 6px;
            text-align: center;
            vertical-align: middle;
            font-size: 20px;
            font-weight: bold;
            background-color: #f0efeb;
            transition: background-color 0.3s;
            cursor: pointer;
        }
        td.drag-over {
            background-color: #d6ccc2;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background-color: #b8c0c2;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
            font-weight: bold;
        }
        button:hover {
            background-color: #a5b0b2;
        }
        textarea {
            margin-top: 10px;
            width: 100%;
            max-width: 100%;
            height: 120px;
            border-radius: 8px;
            padding: 10px;
            border: 1px solid #ccc;
            resize: vertical;
            font-size: 16px;
        }
        .podium {
            margin: 10px auto;
            width: 100px;
            height: 60px;
            border: 1px dashed #bbb;
            border-radius: 6px;
            text-align: center;
            line-height: 60px;
            font-size: 20px;
            font-weight: bold;
            background-color: #ddd;
        }
        .export-title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .export-temp-container {
            padding: 20px;
            background-color: #f4f4f2;
            display: inline-block;
        }
    </style>
</head>
<body>
    <h1>快速排座位</h1>
    <div class="container">
        <div class="student-list" id="studentList">
            <h3>导入男生名单</h3>
            <textarea id="maleInput" placeholder="01 张三&#10;02 李四"></textarea>
            <button onclick="loadStudents('male')">导入男生</button>
            <h3>导入女生名单</h3>
            <textarea id="femaleInput" placeholder="03 王红&#10;04 李丽"></textarea>
            <button onclick="loadStudents('female')">导入女生</button>
            <div class="controls">
                <button onclick="saveStudents()">保存名单</button>
                <button onclick="loadStudentsFile()">加载名单</button>
                <button onclick="clearStudents()">清空名单</button>
            </div>
            <div id="studentsContainer"></div>
        </div>

        <div class="seat-area" id="seatArea">
            <h3>座位表</h3>
            <div class="seat-config">
                <label>行数:</label>
                <input type="number" id="rowsInput" value="8" min="1" max="20">
                <label>列数:</label>
                <input type="number" id="colsInput" value="8" min="1" max="20">
                <button onclick="generateTable()">生成座位表</button>
            </div>
            <table id="seatTable"></table>
            <div class="podium">讲台</div>
            <div class="controls">
                <button onclick="exportSeats()">导出表格</button>
                <button onclick="clearSeats()">清空座位表</button>
                <button onclick="saveSeats()">保存座位表</button>
                <button onclick="loadSeats()">加载座位表</button>
                <button onclick="exportPNG()">导出 PNG 图片</button>
            </div>
            <textarea id="outputArea" placeholder="这里将生成可复制到Excel的表格"></textarea>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        const seatTable = document.getElementById("seatTable");
        const outputArea = document.getElementById("outputArea");
        const studentsContainer = document.getElementById("studentsContainer");
        const seatArea = document.getElementById("seatArea");
        const rowsInput = document.getElementById("rowsInput");
        const colsInput = document.getElementById("colsInput");
        let draggedEl = null;
        let originalParent = null;

        function initTable(rows = 8, cols = 8) {
            // 在重新生成座位表前，先将已排学生放回列表
            clearSeats(false); // 参数 false 表示不触发二次清空
            
            seatTable.innerHTML = "";
            for (let r = 0; r < rows; r++) {
                const row = seatTable.insertRow();
                for (let c = 0; c < cols; c++) {
                    const cell = row.insertCell();
                    cell.addEventListener("dragover", dragOver);
                    cell.addEventListener("drop", drop);
                    cell.addEventListener("dragleave", dragLeave);
                    
                    cell.draggable = true;
                    cell.addEventListener("dragstart", dragStart);
                    cell.addEventListener("dragend", dragEnd);
                }
            }
        }

        function generateTable() {
            const rows = parseInt(rowsInput.value) || 8;
            const cols = parseInt(colsInput.value) || 8;
            initTable(rows, cols);
        }
        
        function loadStudents(type) {
            const input = type === "male" ? document.getElementById("maleInput").value.trim() : document.getElementById("femaleInput").value.trim();
            const names = input.split("\n").map(n => n.trim()).filter(n => n);

            if (type === "male") {
                document.getElementById("maleInput").value = '';
            } else {
                document.getElementById("femaleInput").value = '';
            }

            names.forEach(name => {
                if (!Array.from(studentsContainer.children).some(student => student.textContent === name && student.dataset.gender === type)) {
                    addStudent(name, type);
                }
            });
            sortStudentList();
        }

        function addStudent(name, type) {
            const el = document.createElement("div");
            el.className = `student ${type}`;
            el.textContent = name;
            el.draggable = true;
            el.dataset.gender = type;
            el.addEventListener("dragstart", dragStart);
            el.addEventListener("dragend", dragEnd);
            studentsContainer.appendChild(el);
        }

        function dragStart(e) {
            draggedEl = e.target;
            originalParent = draggedEl.parentNode;
            
            setTimeout(() => {
                draggedEl.style.opacity = '0.5';
            }, 0);
        }

        function dragEnd(e) {
            if (draggedEl) {
                draggedEl.style.opacity = '1';
                draggedEl = null;
                originalParent = null;
            }
        }

        function dragOver(e) {
            e.preventDefault();
            e.target.classList.add("drag-over");
        }

        function dragLeave(e) {
            e.target.classList.remove("drag-over");
        }
        
        function drop(e) {
            e.preventDefault();
            e.target.classList.remove("drag-over");
            if (!draggedEl) return;
        
            const targetCell = e.target.closest('td');
            const isTargetCell = targetCell && targetCell.nodeName === 'TD';
            const isSourceFromList = originalParent.id === 'studentsContainer';
        
            if (isTargetCell) {
                const targetName = targetCell.textContent.trim();
                const targetGender = targetCell.dataset.gender;
        
                if (targetName === "") {
                    if (isSourceFromList) {
                        targetCell.textContent = draggedEl.textContent;
                        targetCell.dataset.gender = draggedEl.dataset.gender;
                        targetCell.style.backgroundColor = draggedEl.dataset.gender === "male" ? "#add8e6" : "#f6c1c1";
                        draggedEl.remove();
                    } else {
                        targetCell.textContent = draggedEl.textContent;
                        targetCell.dataset.gender = draggedEl.dataset.gender;
                        targetCell.style.backgroundColor = draggedEl.dataset.gender === "male" ? "#add8e6" : "#f6c1c1";
                        draggedEl.textContent = "";
                        draggedEl.style.backgroundColor = "#f0efeb";
                        delete draggedEl.dataset.gender;
                    }
                } else {
                    if (isSourceFromList) {
                        addStudent(targetName, targetGender);
                        sortStudentList();
                        targetCell.textContent = draggedEl.textContent;
                        targetCell.dataset.gender = draggedEl.dataset.gender;
                        targetCell.style.backgroundColor = draggedEl.dataset.gender === "male" ? "#add8e6" : "#f6c1c1";
                        draggedEl.remove();
                    } else {
                        const draggedName = draggedEl.textContent.trim();
                        const draggedGender = draggedEl.dataset.gender;
        
                        draggedEl.textContent = targetName;
                        draggedEl.dataset.gender = targetGender;
                        draggedEl.style.backgroundColor = targetGender === "male" ? "#add8e6" : "#f6c1c1";
        
                        targetCell.textContent = draggedName;
                        targetCell.dataset.gender = draggedGender;
                        targetCell.style.backgroundColor = draggedGender === "male" ? "#add8e6" : "#f6c1c1";
                    }
                }
            } else if (e.target.closest('#studentsContainer')) {
                if (!isSourceFromList) {
                    addStudent(draggedEl.textContent.trim(), draggedEl.dataset.gender);
                    draggedEl.textContent = "";
                    draggedEl.style.backgroundColor = "#f0efeb";
                    delete draggedEl.dataset.gender;
                    sortStudentList();
                }
            }
        }
        
        function sortStudentList() {
            const students = Array.from(studentsContainer.children);
            students.sort((a, b) => {
                const numA = parseInt(a.textContent.split(" ")[0]) || 0;
                const numB = parseInt(b.textContent.split(" ")[0]) || 0;
                return numA - numB;
            });
            students.forEach(el => studentsContainer.appendChild(el));
        }

        function clearSeats(returnToStudents = true) {
            for (let r = 0; r < seatTable.rows.length; r++) {
                for (let c = 0; c < seatTable.rows[r].cells.length; c++) {
                    const cell = seatTable.rows[r].cells[c];
                    if (cell.textContent.trim() !== "" && returnToStudents) {
                        addStudent(cell.textContent.trim(), cell.dataset.gender);
                    }
                    cell.textContent = "";
                    cell.style.backgroundColor = "#f0efeb";
                    delete cell.dataset.gender;
                }
            }
            if (returnToStudents) {
                sortStudentList();
            }
        }

        function clearStudents() {
            studentsContainer.innerHTML = "";
            document.getElementById("maleInput").value = '';
            document.getElementById("femaleInput").value = '';
        }

        function exportSeats() {
            let rows = [];
            for (let r = 0; r < seatTable.rows.length; r++) {
                let cols = [];
                for (let c = 0; c < seatTable.rows[r].cells.length; c++) {
                    cols.push(seatTable.rows[r].cells[c].textContent.trim() || "");
                }
                rows.push(cols.join("\t"));
            }
            outputArea.value = rows.join("\n");
        }

        function saveSeats() {
            const data = [];
            for (let r = 0; r < seatTable.rows.length; r++) {
                for (let c = 0; c < seatTable.rows[r].cells.length; c++) {
                    const cell = seatTable.rows[r].cells[c];
                    if (cell.textContent.trim()) {
                        data.push({ row: r, col: c, name: cell.textContent.trim(), gender: cell.dataset.gender });
                    }
                }
            }
            const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "seats.json";
            a.click();
        }
        function loadSeats() {
            const input = document.createElement("input");
            input.type = "file";
            input.accept = ".json";
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    clearSeats();
                    try {
                        const data = JSON.parse(reader.result);
                        if(data.length > 0) {
                            const maxRow = Math.max(...data.map(item => item.row)) + 1;
                            const maxCol = Math.max(...data.map(item => item.col)) + 1;
                            rowsInput.value = maxRow > 20 ? 20 : maxRow;
                            colsInput.value = maxCol > 20 ? 20 : maxCol;
                            initTable(rowsInput.value, colsInput.value);
                        } else {
                            initTable();
                        }
                        data.forEach(item => {
                            if (item.row < seatTable.rows.length && item.col < seatTable.rows[0].cells.length) {
                                const cell = seatTable.rows[item.row].cells[item.col];
                                cell.textContent = item.name;
                                cell.dataset.gender = item.gender;
                                cell.style.backgroundColor = item.gender === "male" ? "#add8e6" : "#f6c1c1";
                            }
                        });
                    } catch (error) {
                        alert("加载座位表文件失败，请检查文件格式。");
                        console.error("Error loading seats:", error);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function saveStudents() {
            const names = Array.from(studentsContainer.children).map(el => ({ name: el.textContent, gender: el.dataset.gender }));
            const blob = new Blob([JSON.stringify(names)], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "students.json";
            a.click();
        }
        function loadStudentsFile() {
            const input = document.createElement("input");
            input.type = "file";
            input.accept = ".json";
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    clearStudents();
                    try {
                        const data = JSON.parse(reader.result);
                        data.forEach(item => addStudent(item.name, item.gender));
                        sortStudentList();
                    } catch (error) {
                        alert("加载学生名单文件失败，请检查文件格式。");
                        console.error("Error loading students:", error);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function exportPNG() {
            const now = new Date();
            const dateStr = `${now.getFullYear()}年${(now.getMonth() + 1).toString().padStart(2, '0')}月${now.getDate().toString().padStart(2, '0')}日`;

            const exportTempContainer = document.createElement('div');
            exportTempContainer.className = 'export-temp-container';

            const title = document.createElement('div');
            title.className = 'export-title';
            title.textContent = `座位表 ${dateStr}`;
            exportTempContainer.appendChild(title);

            const tableClone = seatTable.cloneNode(true);
            exportTempContainer.appendChild(tableClone);

            const podiumClone = document.querySelector('.podium').cloneNode(true);
            exportTempContainer.appendChild(podiumClone);

            document.body.appendChild(exportTempContainer);

            html2canvas(exportTempContainer, {
                scale: 2,
                logging: false,
                useCORS: true
            }).then(canvas => {
                document.body.removeChild(exportTempContainer);

                const a = document.createElement("a");
                a.href = canvas.toDataURL("image/png");
                a.download = `座位表_${dateStr}.png`;
                a.click();
            }).catch(error => {
                console.error("导出PNG失败:", error);
                alert("导出图片失败，请稍后再试。");
                if (document.body.contains(exportTempContainer)) {
                    document.body.removeChild(exportTempContainer);
                }
            });
        }

        // 初始化
        initTable();
    </script>
</body>
</html>
