<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>快速排座位</title>
    <style>
        body {
            font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: transparent;
            margin: 0;
            padding: 20px;
            color: #333;
            font-size: 18px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #555;
            font-weight: bold;
        }
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: stretch;
        }
        
        .panel {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }
        
        .import-controls {
            width: 300px;
        }

        .male-list, .female-list {
            width: 200px;
        }
        
        .seat-area {
            flex: 1;
            align-items: center;
            min-width: 600px;
        }

        .student-list-container {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 10px;
        }

        .student {
            border-radius: 6px;
            padding: 8px;
            margin: 6px 0;
            text-align: center;
            cursor: grab;
            user-select: none;
            font-weight: bold;
            font-size: 18px;
            transition: background-color 0.2s, border 0.2s;
            position: relative;
            overflow: hidden;
            z-index: 0;
            border: 1px solid transparent; 
        }
        .male {
            background-color: #add8e6;
            color: #333;
        }
        .female {
            background-color: #f6c1c1;
            color: #333;
        }
        .student:active {
            cursor: grabbing;
        }

        .leader {
            color: #333;
            border: 3px solid; 
        }
        .leader.male {
            background: linear-gradient(to right, #4682b4, #add8e6 60%); 
            border-color: #1a4f78;
        }
        .leader.female {
            background: linear-gradient(to right, #b47979, #f6c1c1 60%); 
            border-color: #8c4c4c;
        }
        
        .seat-config {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap; 
            justify-content: center;
        }
        .seat-config input[type="number"] {
            width: 50px;
            text-align: center;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .seat-config button {
            padding: 5px 10px;
        }

        .auto-seat-controls {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }
        .auto-seat-controls button {
            background-color: #5cb85c;
            color: white;
            font-size: 18px;
            padding: 10px 20px;
        }
        .auto-seat-controls button:hover {
            background-color: #4cae4c;
        }

        /* 为顶部控制按钮留出空间 */
        #seatTable {
            margin-top: 15px; 
            border-collapse: separate;
            border-spacing: 6px;
        }
        td {
            width: 100px;
            height: 60px;
            border: 1px dashed #bbb; 
            border-radius: 6px;
            text-align: center;
            vertical-align: middle;
            font-size: 20px;
            font-weight: bold;
            background-color: #f0efeb;
            transition: background-color 0.3s, border 0.2s;
            cursor: pointer;
            position: relative;
            /* overflow: hidden; 被移除以允许按钮显示在边缘外 */
            z-index: 0;
        }
        
        /* 过道单元格样式 */
        td.aisle {
            width: 30px; 
            border: none;
            background-color: transparent;
            cursor: default;
        }
        
        /* --- 新增：动态过道控制按钮样式 --- */
        .aisle-control-btn {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            color: white;
            border: none;
            font-size: 18px;
            font-weight: bold;
            line-height: 20px;
            cursor: pointer;
            z-index: 10;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: transform 0.2s, background-color 0.2s;
        }
        .aisle-control-btn:hover {
            transform: scale(1.15);
        }
        .aisle-control-btn.add {
            background-color: #5cb85c;
            /* 漂浮在右侧列间隙（6px 的间隙中心） */
            top: -12px;
            right: -15px; 
        }
        .aisle-control-btn.add:hover {
            background-color: #4cae4c;
        }
        .aisle-control-btn.remove {
            background-color: #d9534f;
            /* 过道列本身的中心 */
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
        }
        .aisle-control-btn.remove:hover {
            background-color: #c9302c;
            transform: translateX(-50%) scale(1.15);
        }
        
        td.drag-over {
            background-color: #d6ccc2;
        }
        td.leader {
            color: #333;
            border: 3px solid; 
        }
        td[data-gender="male"].leader {
            background: linear-gradient(to right, #4682b4, #add8e6 60%); 
            border-color: #1a4f78;
        }
        td[data-gender="female"].leader {
            background: linear-gradient(to right, #b47979, #f6c1c1 60%); 
            border-color: #8c4c4c;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background-color: #b8c0c2;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
            font-weight: bold;
        }
        button:hover {
            background-color: #a5b0b2;
        }
        textarea {
            margin-top: 10px;
            width: 100%;
            max-width: 100%;
            height: 120px;
            border-radius: 8px;
            padding: 10px;
            border: 1px solid #ccc;
            resize: vertical;
            font-size: 16px;
        }
        .podium {
            margin: 10px auto;
            width: 100px;
            height: 60px;
            border: 1px dashed #bbb;
            border-radius: 6px;
            text-align: center;
            line-height: 60px;
            font-size: 20px;
            font-weight: bold;
            background-color: #ddd;
        }
        .export-title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .export-temp-container {
            padding: 20px;
            background-color: transparent;
            display: inline-block;
        }

        .reversed-view table {
            transform: rotate(180deg);
        }
        .reversed-view td {
            transform: rotate(-180deg);
        }

        #leaderBox, #talkativeBox {
            margin-top: 20px;
            border: 2px dashed #a5a5a5;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            min-height: 80px;
        }
        #leaderBox h4, #talkativeBox h4 {
            margin: 0 0 10px 0;
            color: #777;
        }

        .student.talkative::before, td.talkative::before {
            content: '📣'; 
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            z-index: 1;
        }
    </style>
</head>
<body>
    <h1>快速排座位</h1>
    <div class="container">
        <div class="panel import-controls">
            <h3>导入名单</h3>
            <h4>导入男生</h4>
            <textarea id="maleInput" placeholder="01 张三&#10;02 李四"></textarea>
            <button onclick="loadStudents('male')">导入男生</button>
            <h4>导入女生</h4>
            <textarea id="femaleInput" placeholder="03 王红&#10;04 李丽"></textarea>
            <button onclick="loadStudents('female')">导入女生</button>
            <div class="controls">
                <button onclick="saveStudents()">保存名单</button>
                <button onclick="loadStudentsFile()">加载名单</button>
                <button onclick="clearStudents()">清空名单</button>
            </div>
            
            <div id="leaderBox">
                <h4>标记小组长 (拖入学生到此)</h4>
            </div>
            <div id="talkativeBox">
                <h4>标记爱讲话学生 (拖入学生到此)</h4>
            </div>
        </div>

        <div class="panel male-list">
            <h3>未排座位男生</h3>
            <div id="maleStudentsContainer" class="student-list-container"></div>
        </div>

        <div class="panel female-list">
            <h3>未排座位女生</h3>
            <div id="femaleStudentsContainer" class="student-list-container"></div>
        </div>

        <div class="panel seat-area" id="seatArea">
            <h3>座位表</h3>
            <div class="seat-config">
                <label>行数:</label>
                <input type="number" id="rowsInput" value="8" min="1" max="20">
                <label>座位列数:</label>
                <input type="number" id="colsInput" value="8" min="1" max="20">
                <button onclick="generateTable()" title="这将清空当前所有座位并重新生成空表格">重置座位表格</button>
            </div>
            <div class="auto-seat-controls">
                <button onclick="autoSeat()">随机排座</button>
            </div>
            <table id="seatTable"></table>
            <div class="podium">讲台</div>
            <div class="controls">
                <button onclick="exportSeatsTeacher()">导出老师视角表格</button>
                <button onclick="exportSeatsStudent()">导出学生视角表格</button>
                <button onclick="clearSeats(true)">清空座位表</button>
                <button onclick="saveSeats()">保存座位表</button>
                <button onclick="loadSeats()">加载座位表</button>
                <button onclick="exportPNG()">导出老师视角 PNG</button>
                <button onclick="exportPNGReversed()">导出学生视角 PNG</button>
            </div>
            <textarea id="outputArea" placeholder="这里将生成可复制到Excel的表格"></textarea>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        const seatTable = document.getElementById("seatTable");
        const outputArea = document.getElementById("outputArea");
        const maleStudentsContainer = document.getElementById("maleStudentsContainer");
        const femaleStudentsContainer = document.getElementById("femaleStudentsContainer");
        const rowsInput = document.getElementById("rowsInput");
        const colsInput = document.getElementById("colsInput");
        const leaderBox = document.getElementById("leaderBox");
        const talkativeBox = document.getElementById("talkativeBox");

        let draggedEl = null;
        let originalParent = null;

        // 新增：用于全局保存动态激活的过道位置的集合（1代表第1列和第2列之间有过道）
        let activeAisles = new Set();

        // 辅助函数：安全获取座位上的学生名字（排除控制按钮文本）
        function getStudentName(cell) {
            if (!cell) return "";
            let clonedCell = cell.cloneNode(true);
            clonedCell.querySelectorAll('.aisle-control-btn').forEach(b => b.remove());
            return clonedCell.textContent.trim();
        }

        // 辅助函数：安全设置座位上的学生名字（保留控制按钮）
        function setStudentName(cell, name) {
            if (!cell) return;
            const buttons = Array.from(cell.querySelectorAll('.aisle-control-btn'));
            cell.innerHTML = "";
            cell.textContent = name;
            buttons.forEach(btn => cell.appendChild(btn));
        }

        leaderBox.addEventListener("dragover", dragOver);
        leaderBox.addEventListener("drop", (e) => {
            e.preventDefault();
            leaderBox.classList.remove("drag-over");
            
            if (!draggedEl) return;
            
            if (originalParent === maleStudentsContainer || originalParent === femaleStudentsContainer) {
                draggedEl.classList.toggle('leader');
            }
        });
        leaderBox.addEventListener("dragleave", dragLeave);

        talkativeBox.addEventListener("dragover", dragOver);
        talkativeBox.addEventListener("drop", (e) => {
            e.preventDefault();
            talkativeBox.classList.remove("drag-over");
            if (!draggedEl) return;
            if (originalParent === maleStudentsContainer || originalParent === femaleStudentsContainer) {
                draggedEl.classList.toggle('talkative');
            }
        });
        talkativeBox.addEventListener("dragleave", dragLeave);

        document.addEventListener("dragend", (e) => {
            if (!draggedEl) return;
            // 判断松手位置时，排除掉过道元素 td:not(.aisle) 和 按钮元素
            const dropTarget = e.target.closest('td:not(.aisle)') || e.target.closest('.student-list-container') || e.target.closest('#leaderBox') || e.target.closest('#talkativeBox');
            if (!dropTarget && !(originalParent === maleStudentsContainer || originalParent === femaleStudentsContainer)) {
                const gender = draggedEl.dataset.gender;
                const name = draggedEl.tagName.toLowerCase() === 'td' ? getStudentName(draggedEl) : draggedEl.textContent.trim();
                const isLeader = draggedEl.classList.contains('leader');
                const isTalkative = draggedEl.classList.contains('talkative');
                
                addStudent(name, gender, isLeader, isTalkative);
                sortStudentList(gender);

                if (draggedEl.tagName.toLowerCase() === 'td') {
                    setStudentName(draggedEl, "");
                } else {
                    draggedEl.textContent = "";
                }
                draggedEl.style.backgroundColor = "#f0efeb";
                draggedEl.classList.remove('leader', 'talkative');
                draggedEl.style.border = '1px dashed #bbb'; 
                delete draggedEl.dataset.gender;
            }
            draggedEl.style.opacity = '1'; 
        });

        /**
         * 初始化座位表格 (含动态控制逻辑)
         */
        function initTable(rows = 8, cols = 8, doClear = true) {
            if (doClear) {
                clearSeats(false); // 如果重绘时不保留数据，清空内容并不退回学生
            }
            
            seatTable.innerHTML = "";
            for (let r = 0; r < rows; r++) {
                const row = seatTable.insertRow();
                for (let c = 0; c < cols; c++) {
                    // 1. 生成实际座位
                    const cell = row.insertCell();
                    cell.addEventListener("dragover", dragOver);
                    cell.addEventListener("drop", drop);
                    cell.addEventListener("dragleave", dragLeave);
                    
                    cell.draggable = true;
                    cell.addEventListener("dragstart", dragStart);

                    // 检查此列之后是否有激活的过道
                    const isAisleActive = activeAisles.has(c + 1);

                    // 2. 如果右边没有过道，在第一行当前座位右边缘放置一个添加"+"按钮
                    if (r === 0 && c < cols - 1 && !isAisleActive) {
                        const btn = document.createElement("button");
                        btn.className = "aisle-control-btn add";
                        btn.textContent = "+";
                        btn.title = "在此处添加过道";
                        btn.onclick = (e) => {
                            e.stopPropagation();
                            activeAisles.add(c + 1);
                            rebuildTableKeepData();
                        };
                        cell.appendChild(btn);
                    }

                    // 3. 如果右边激活了过道，生成专门的占位空列
                    if (isAisleActive && c < cols - 1) {
                        const aisleCell = row.insertCell();
                        aisleCell.className = "aisle";
                        
                        // 在第一行的过道列内放置一个移除"-"按钮
                        if (r === 0) {
                            const btn = document.createElement("button");
                            btn.className = "aisle-control-btn remove";
                            btn.textContent = "-";
                            btn.title = "移除该过道";
                            btn.onclick = (e) => {
                                e.stopPropagation();
                                activeAisles.delete(c + 1);
                                rebuildTableKeepData();
                            };
                            aisleCell.appendChild(btn);
                        }
                    }
                }
            }
        }

        /**
         * 在保证桌上已经排好的学生不丢失的前提下，重新渲染过道
         */
        function rebuildTableKeepData() {
            // 1. 读取当前桌上所有学生数据
            const data = [];
            const rows = seatTable.rows;
            for (let r = 0; r < rows.length; r++) {
                const cells = rows[r].cells;
                let logicalCol = 0; 
                for (let c = 0; c < cells.length; c++) {
                    const cell = cells[c];
                    if (cell.classList.contains('aisle')) continue;

                    const studentName = getStudentName(cell);
                    if (studentName !== "") {
                        data.push({ 
                            row: r, 
                            col: logicalCol, 
                            name: studentName, 
                            gender: cell.dataset.gender, 
                            isLeader: cell.classList.contains('leader'),
                            isTalkative: cell.classList.contains('talkative') 
                        });
                    }
                    logicalCol++; 
                }
            }
            
            // 2. 使用新布局重新绘制DOM (无需触发数据清理逻辑)
            initTable(parseInt(rowsInput.value), parseInt(colsInput.value), false);
            
            // 3. 将刚刚读到的学生放回新生成的格子中
            data.forEach(item => {
                if (item.row < seatTable.rows.length) {
                    const seatCells = seatTable.rows[item.row].querySelectorAll('td:not(.aisle)');
                    if (item.col < seatCells.length) {
                        const cell = seatCells[item.col];
                        setStudentName(cell, item.name);
                        cell.dataset.gender = item.gender;
                        cell.style.backgroundColor = item.gender === "male" ? "#add8e6" : "#f6c1c1"; 
                        if (item.isLeader) cell.classList.add('leader');
                        if (item.isTalkative) cell.classList.add('talkative');
                    }
                }
            });
        }

        function generateTable() {
            const rows = parseInt(rowsInput.value) || 8;
            const cols = parseInt(colsInput.value) || 8;
            
            // 避免因列数减少导致无效的过道存留
            const newActiveAisles = new Set();
            activeAisles.forEach(col => {
                if (col < cols) newActiveAisles.add(col);
            });
            activeAisles = newActiveAisles;

            // 完全重置模式：先把人都清回待排区，再生成表格
            clearSeats(true);
            initTable(rows, cols, false);
        }
        
        function loadStudents(type) {
            const input = type === "male" ? document.getElementById("maleInput").value.trim() : document.getElementById("femaleInput").value.trim();
            const names = input.split("\n").map(n => n.trim()).filter(n => n);

            if (type === "male") {
                document.getElementById("maleInput").value = '';
            } else {
                document.getElementById("femaleInput").value = '';
            }

            names.forEach(name => {
                const container = type === 'male' ? maleStudentsContainer : femaleStudentsContainer;
                const existingStudent = Array.from(container.children).find(student => student.textContent === name && student.dataset.gender === type);
                if (!existingStudent) {
                    addStudent(name, type, false, false); 
                }
            });
            sortStudentList(type);
        }

        function addStudent(name, type, isLeader = false, isTalkative = false) {
            const el = document.createElement("div");
            el.className = `student ${type}`;
            el.textContent = name;
            el.draggable = true;
            el.dataset.gender = type;
            if (isLeader) {
                el.classList.add('leader');
            }
            if (isTalkative) {
                el.classList.add('talkative');
            }
            el.addEventListener("dragstart", dragStart);
            if (type === 'male') {
                maleStudentsContainer.appendChild(el);
            } else {
                femaleStudentsContainer.appendChild(el);
            }
        }

        function dragStart(e) {
            draggedEl = e.target;
            originalParent = draggedEl.parentNode;
            
            setTimeout(() => {
                draggedEl.style.opacity = '0.5';
            }, 0);
        }
        
        function dragOver(e) {
            e.preventDefault();
            const target = e.target.closest('td:not(.aisle)') || e.target.closest('.student-list-container') || e.target.closest('#leaderBox') || e.target.closest('#talkativeBox');
            if (target) {
                target.classList.add("drag-over");
            }
        }

        function dragLeave(e) {
            const target = e.target.closest('td:not(.aisle)') || e.target.closest('.student-list-container') || e.target.closest('#leaderBox') || e.target.closest('#talkativeBox');
            if (target) {
                target.classList.remove("drag-over");
            }
        }
        
        function drop(e) {
            e.preventDefault();
            const target = e.target.closest('td:not(.aisle)') || e.target.closest('.student-list-container') || e.target.closest('#leaderBox') || e.target.closest('#talkativeBox');
            if (target) {
                 target.classList.remove("drag-over");
            }
            if (!draggedEl) return;
        
            const targetCell = e.target.closest('td:not(.aisle)');
            const targetListContainer = e.target.closest('.student-list-container');
        
            const draggedIsLeader = draggedEl.classList.contains('leader');
            const draggedIsTalkative = draggedEl.classList.contains('talkative');

            if (targetCell) { 
                const targetName = getStudentName(targetCell);
                const targetGender = targetCell.dataset.gender;
                const targetIsLeader = targetCell.classList.contains('leader');
                const targetIsTalkative = targetCell.classList.contains('talkative');
        
                if (targetName === "") { 
                    const draggedName = draggedEl.tagName.toLowerCase() === 'td' ? getStudentName(draggedEl) : draggedEl.textContent.trim();
                    setStudentName(targetCell, draggedName);
                    targetCell.dataset.gender = draggedEl.dataset.gender;
                    targetCell.style.backgroundColor = draggedEl.dataset.gender === "male" ? "#add8e6" : "#f6c1c1"; 
                    
                    draggedIsLeader ? targetCell.classList.add('leader') : targetCell.classList.remove('leader');
                    draggedIsTalkative ? targetCell.classList.add('talkative') : targetCell.classList.remove('talkative');
                    
                    if (originalParent === maleStudentsContainer || originalParent === femaleStudentsContainer) {
                        draggedEl.remove();
                    } else { 
                        setStudentName(draggedEl, "");
                        draggedEl.style.backgroundColor = "#f0efeb";
                        draggedEl.classList.remove('leader', 'talkative');
                        delete draggedEl.dataset.gender;
                    }
                } else { 
                    const draggedName = draggedEl.tagName.toLowerCase() === 'td' ? getStudentName(draggedEl) : draggedEl.textContent.trim();
                    const draggedGender = draggedEl.dataset.gender;

                    if (originalParent === maleStudentsContainer || originalParent === femaleStudentsContainer) { 
                        addStudent(targetName, targetGender, targetIsLeader, targetIsTalkative);
                        sortStudentList(targetGender);
                        
                        setStudentName(targetCell, draggedName);
                        targetCell.dataset.gender = draggedGender;
                        targetCell.style.backgroundColor = draggedGender === "male" ? "#add8e6" : "#f6c1c1";
                        draggedIsLeader ? targetCell.classList.add('leader') : targetCell.classList.remove('leader');
                        draggedIsTalkative ? targetCell.classList.add('talkative') : targetCell.classList.remove('talkative');
                        draggedEl.remove();
                    } else { 
                        setStudentName(draggedEl, targetName);
                        draggedEl.dataset.gender = targetGender;
                        draggedEl.style.backgroundColor = targetGender === "male" ? "#add8e6" : "#f6c1c1";
                        targetIsLeader ? draggedEl.classList.add('leader') : draggedEl.classList.remove('leader');
                        targetIsTalkative ? draggedEl.classList.add('talkative') : draggedEl.classList.remove('talkative');
        
                        setStudentName(targetCell, draggedName);
                        targetCell.dataset.gender = draggedGender;
                        targetCell.style.backgroundColor = draggedGender === "male" ? "#add8e6" : "#f6c1c1";
                        draggedIsLeader ? targetCell.classList.add('leader') : targetCell.classList.remove('leader');
                        draggedIsTalkative ? targetCell.classList.add('talkative') : targetCell.classList.remove('talkative');
                    }
                }
            } else if (targetListContainer) { 
                if (!(originalParent === maleStudentsContainer || originalParent === femaleStudentsContainer)) { 
                    const studentGender = draggedEl.dataset.gender;
                    const isLeader = draggedEl.classList.contains('leader');
                    const isTalkative = draggedEl.classList.contains('talkative');
                    const draggedName = draggedEl.tagName.toLowerCase() === 'td' ? getStudentName(draggedEl) : draggedEl.textContent.trim();
                    addStudent(draggedName, studentGender, isLeader, isTalkative);
                    
                    if (draggedEl.tagName.toLowerCase() === 'td') {
                        setStudentName(draggedEl, "");
                    } else {
                        draggedEl.textContent = "";
                    }
                    draggedEl.style.backgroundColor = "#f0efeb";
                    draggedEl.classList.remove('leader', 'talkative');
                    delete draggedEl.dataset.gender;
                    sortStudentList(studentGender);
                }
            }
        }
        
        function sortStudentList(type) {
            const container = type === 'male' ? maleStudentsContainer : femaleStudentsContainer;
            const students = Array.from(container.children);
            students.sort((a, b) => {
                const numA = parseInt(a.textContent.split(" ")[0]) || 0;
                const numB = parseInt(b.textContent.split(" ")[0]) || 0;
                return numA - numB;
            });
            students.forEach(el => container.appendChild(el));
        }

        function clearSeats(returnToStudents = true) {
            const rows = seatTable.rows;
            for (let r = 0; r < rows.length; r++) {
                const cells = rows[r].cells;
                for (let c = 0; c < cells.length; c++) {
                    const cell = cells[c];
                    
                    if (cell.classList.contains('aisle')) continue;

                    const studentName = getStudentName(cell);
                    if (studentName !== "" && returnToStudents) {
                        const isLeader = cell.classList.contains('leader');
                        const isTalkative = cell.classList.contains('talkative');
                        addStudent(studentName, cell.dataset.gender, isLeader, isTalkative);
                    }
                    
                    setStudentName(cell, "");
                    cell.style.backgroundColor = "#f0efeb";
                    cell.classList.remove('leader', 'talkative');
                    delete cell.dataset.gender;
                }
            }
            if (returnToStudents) {
                sortStudentList('male');
                sortStudentList('female');
            }
        }

        function clearStudents() {
            maleStudentsContainer.innerHTML = "";
            femaleStudentsContainer.innerHTML = "";
            document.getElementById("maleInput").value = '';
            document.getElementById("femaleInput").value = '';
        }

        function exportSeatsTeacher() {
            let rows = [];
            for (let r = 0; r < seatTable.rows.length; r++) {
                let cols = [];
                for (let c = 0; c < seatTable.rows[r].cells.length; c++) {
                    const cell = seatTable.rows[r].cells[c];
                    if (cell.classList.contains('aisle')) {
                        cols.push(""); 
                        continue;
                    }
                    cols.push(getStudentName(cell)); 
                }
                rows.push(cols.join("\t"));
            }
            outputArea.value = rows.join("\n");
        }

        function exportSeatsStudent() {
            let outputRows = [];
            const numRows = seatTable.rows.length;
            
            for (let r = numRows - 1; r >= 0; r--) { 
                let outputCols = [];
                const numCols = seatTable.rows[r].cells.length;
                
                for (let c = numCols - 1; c >= 0; c--) { 
                    const cell = seatTable.rows[r].cells[c];
                    if (cell.classList.contains('aisle')) {
                        outputCols.push(""); 
                        continue;
                    }
                    outputCols.push(getStudentName(cell)); 
                }
                outputRows.push(outputCols.join("\t"));
            }
            outputArea.value = outputRows.join("\n");
        }


        function saveSeats() {
            const data = [];
            const rows = seatTable.rows;
            for (let r = 0; r < rows.length; r++) {
                const cells = rows[r].cells;
                let logicalCol = 0; 
                for (let c = 0; c < cells.length; c++) {
                    const cell = cells[c];
                    if (cell.classList.contains('aisle')) continue;

                    const studentName = getStudentName(cell);
                    if (studentName !== "") {
                        data.push({ 
                            row: r, 
                            col: logicalCol, 
                            name: studentName, 
                            gender: cell.dataset.gender, 
                            isLeader: cell.classList.contains('leader'),
                            isTalkative: cell.classList.contains('talkative') 
                        });
                    }
                    logicalCol++; 
                }
            }
            
            const exportData = {
                aisles: Array.from(activeAisles).join(','),
                seats: data
            };

            const blob = new Blob([JSON.stringify(exportData)], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "seats.json";
            a.click();
        }
        
        function loadSeats() {
            const input = document.createElement("input");
            input.type = "file";
            input.accept = ".json";
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    clearSeats(true);
                    try {
                        const parsedData = JSON.parse(reader.result);
                        let seatsData = parsedData;
                        
                        activeAisles.clear();
                        if (parsedData.seats !== undefined && parsedData.aisles !== undefined) {
                            if(parsedData.aisles) {
                                parsedData.aisles.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n))
                                    .forEach(col => activeAisles.add(col));
                            }
                            seatsData = parsedData.seats;
                        }

                        if(seatsData.length > 0) {
                            const maxRow = Math.max(...seatsData.map(item => item.row)) + 1;
                            const maxCol = Math.max(...seatsData.map(item => item.col)) + 1;
                            rowsInput.value = maxRow > 20 ? 20 : maxRow;
                            colsInput.value = maxCol > 20 ? 20 : maxCol;
                            initTable(rowsInput.value, colsInput.value, false); 
                        } else {
                            initTable(8, 8, false);
                        }
                        
                        seatsData.forEach(item => {
                            if (item.row < seatTable.rows.length) {
                                const seatCells = seatTable.rows[item.row].querySelectorAll('td:not(.aisle)');
                                if (item.col < seatCells.length) {
                                    const cell = seatCells[item.col];
                                    setStudentName(cell, item.name);
                                    cell.dataset.gender = item.gender;
                                    cell.style.backgroundColor = item.gender === "male" ? "#add8e6" : "#f6c1c1"; 
                                    if (item.isLeader) cell.classList.add('leader');
                                    if (item.isTalkative) cell.classList.add('talkative');
                                }
                            }
                        });
                    } catch (error) {
                        alert("加载座位表文件失败，请检查文件格式。");
                        console.error("Error loading seats:", error);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function saveStudents() {
            const maleNames = Array.from(maleStudentsContainer.children).map(el => ({ name: el.textContent, gender: el.dataset.gender, isLeader: el.classList.contains('leader'), isTalkative: el.classList.contains('talkative') }));
            const femaleNames = Array.from(femaleStudentsContainer.children).map(el => ({ name: el.textContent, gender: el.dataset.gender, isLeader: el.classList.contains('leader'), isTalkative: el.classList.contains('talkative') }));
            const allNames = [...maleNames, ...femaleNames];
            const blob = new Blob([JSON.stringify(allNames)], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "students.json";
            a.click();
        }
        
        function loadStudentsFile() {
            const input = document.createElement("input");
            input.type = "file";
            input.accept = ".json";
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    clearStudents();
                    try {
                        const data = JSON.parse(reader.result);
                        data.forEach(item => {
                            addStudent(item.name, item.gender, item.isLeader, item.isTalkative);
                        });
                        sortStudentList('male');
                        sortStudentList('female');
                    } catch (error) {
                        alert("加载学生名单文件失败，请检查文件格式。");
                        console.error("Error loading students:", error);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

            const dateStr = `${now.getFullYear()}年${(now.getMonth() + 1).toString().padStart(2, '0')}月${now.getDate().toString().padStart(2, '0')}日`;

            const exportTempContainer = document.createElement('div');
            exportTempContainer.className = 'export-temp-container';

            const title = document.createElement('div');
            title.className = 'export-title';
            title.textContent = `座位表 ${dateStr}`;
            exportTempContainer.appendChild(title);

            const tableClone = seatTable.cloneNode(true);
            tableClone.querySelectorAll('.talkative').forEach(el => el.classList.remove('talkative'));
            // 新增：移除克隆出来的表格里的加减号控制按钮
            tableClone.querySelectorAll('.aisle-control-btn').forEach(btn => btn.remove());

            exportTempContainer.appendChild(tableClone);

            const podiumClone = document.querySelector('.podium').cloneNode(true);
            exportTempContainer.appendChild(podiumClone);

            document.body.appendChild(exportTempContainer);

            html2canvas(exportTempContainer, {
                scale: 2,
                logging: false,

            }).then(canvas => {

                a.href = canvas.toDataURL("image/png");

                a.click();

                console.error("导出PNG失败:", error);

        }

            tableClone.querySelectorAll('.aisle-control-btn').forEach(btn => btn.remove());

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function autoSeat() {
            clearSeats(true);

            const cols = parseInt(colsInput.value) || 8;
            const rows = parseInt(rowsInput.value) || 8;
            
            const maleStudents = Array.from(maleStudentsContainer.children).map(el => ({
                name: el.textContent,
                gender: el.dataset.gender,
                isLeader: el.classList.contains('leader'),
                isTalkative: el.classList.contains('talkative'),
                element: el
            }));
            const femaleStudents = Array.from(femaleStudentsContainer.children).map(el => ({
                name: el.textContent,
                gender: el.dataset.gender,
                isLeader: el.classList.contains('leader'),
                isTalkative: el.classList.contains('talkative'),
                element: el
            }));

            let allStudents = [...maleStudents, ...femaleStudents];
            let leaders = allStudents.filter(s => s.isLeader);
            let nonLeaders = allStudents.filter(s => !s.isLeader);

            if (leaders.length > 0) {
                if (leaders.length !== cols) {
                    alert(`请检查组长人数 (${leaders.length}人) 与座位表真实列数 (${cols}列) 是否对应。\n若不对应，组长将无法均匀分配。`);
                    return;
                }
            }

            clearSeats(false);

            if (leaders.length === cols) {
                shuffle(leaders);
                for (let c = 0; c < cols; c++) {
                    const student = leaders[c];
                    const randomRow = Math.floor(Math.random() * rows);
                    const seatCells = seatTable.rows[randomRow].querySelectorAll('td:not(.aisle)');
                    const cell = seatCells[c];
                    
                    setStudentName(cell, student.name);
                    cell.dataset.gender = student.gender;
                    cell.classList.add('leader');
                    if(student.isTalkative) cell.classList.add('talkative');
                    cell.style.backgroundColor = student.gender === "male" ? "#add8e6" : "#f6c1c1";
                    
                    student.element.remove();
                }
            }

            shuffle(nonLeaders);
            let studentQueue = nonLeaders;
            
            let studentIndex = 0;
            for (let r = rows - 1; r >= 0; r--) {
                const seatCells = seatTable.rows[r].querySelectorAll('td:not(.aisle)');
                for (let c = 0; c < cols; c++) {
                    const cell = seatCells[c];
                    const studentName = getStudentName(cell);

                    if (studentName === "" && studentIndex < studentQueue.length) {
                        const student = studentQueue[studentIndex];
                        
                        setStudentName(cell, student.name);
                        cell.dataset.gender = student.gender;
                        cell.classList.remove('leader');
                        if(student.isTalkative) cell.classList.add('talkative');
                        cell.style.backgroundColor = student.gender === "male" ? "#add8e6" : "#f6c1c1";
                        
                        student.element.remove();
                        
                        studentIndex++;
                    }
                }
            }

            maleStudentsContainer.innerHTML = "";
            femaleStudentsContainer.innerHTML = "";
        }

        initTable(8, 8, false);
    </script>
