<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>快速排座位</title>
    <style>
        body {
            font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #f4f4f2;
            margin: 0;
            padding: 20px;
            color: #333;
            font-size: 18px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #555;
            font-weight: bold;
        }
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap; /* 允许换行，适应小屏幕 */
            justify-content: center; /* 居中对齐 */
        }
        .student-list, .seat-area {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        .student-list {
            width: 300px;
            max-height: 650px;
            overflow-y: auto;
            flex-shrink: 0; /* 防止被挤压 */
        }
        .student {
            border-radius: 6px;
            padding: 8px;
            margin: 6px 0;
            text-align: center;
            cursor: grab;
            user-select: none;
            font-weight: bold;
            font-size: 18px;
            transition: background-color 0.2s;
        }
        .male {
            background-color: #add8e6;
        }
        .female {
            background-color: #f6c1c1;
        }
        .student:active {
            cursor: grabbing;
        }
        .seat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 600px; /* 保证座位表有足够的宽度 */
        }
        table {
            border-collapse: separate;
            border-spacing: 6px;
        }
        td {
            width: 100px;
            height: 60px;
            border: 1px dashed #bbb;
            border-radius: 6px;
            text-align: center;
            vertical-align: middle;
            font-size: 20px;
            font-weight: bold;
            background-color: #f0efeb;
            transition: background-color 0.3s;
        }
        td.drag-over {
            background-color: #d6ccc2;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background-color: #b8c0c2;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
            font-weight: bold;
        }
        button:hover {
            background-color: #a5b0b2;
        }
        textarea {
            margin-top: 10px;
            width: 100%;
            max-width: 100%; /* 确保在小屏幕上不会溢出 */
            height: 120px;
            border-radius: 8px;
            padding: 10px;
            border: 1px solid #ccc;
            resize: vertical; /* 允许垂直调整大小 */
            font-size: 16px;
        }
        .podium {
            margin: 10px auto;
            width: 100px;
            height: 60px;
            border: 1px dashed #bbb;
            border-radius: 6px;
            text-align: center;
            line-height: 60px;
            font-size: 20px;
            font-weight: bold;
            background-color: #ddd;
        }
        .export-title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        /* 导出PNG时临时使用的样式，避免直接修改原始元素 */
        .export-temp-container {
            padding: 20px;
            background-color: #f4f4f2;
            display: inline-block; /* 使得容器只占据其内容的宽度和高度 */
        }
    </style>
</head>
<body>
    <h1>快速排座位</h1>
    <div class="container">
        <div class="student-list" id="studentList">
            <h3>导入男生名单</h3>
            <textarea id="maleInput" placeholder="01 张三&#10;02 李四"></textarea>
            <button onclick="loadStudents('male')">导入男生</button>
            <h3>导入女生名单</h3>
            <textarea id="femaleInput" placeholder="03 王红&#10;04 李丽"></textarea>
            <button onclick="loadStudents('female')">导入女生</button>
            <div class="controls">
                <button onclick="saveStudents()">保存名单</button>
                <button onclick="loadStudentsFile()">加载名单</button>
                <button onclick="clearStudents()">清空名单</button>
            </div>
            <div id="studentsContainer"></div>
        </div>

        <div class="seat-area" id="seatArea">
            <h3>座位表 (8x8)</h3>
            <table id="seatTable"></table>
            <div class="podium">讲台</div>
            <div class="controls">
                <button onclick="exportSeats()">导出表格</button>
                <button onclick="clearSeats()">清空座位表</button>
                <button onclick="saveSeats()">保存座位表</button>
                <button onclick="loadSeats()">加载座位表</button>
                <button onclick="exportPNG()">导出 PNG 图片</button>
            </div>
            <textarea id="outputArea" placeholder="这里将生成可复制到Excel的表格"></textarea>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        const seatTable = document.getElementById("seatTable");
        const outputArea = document.getElementById("outputArea");
        const studentsContainer = document.getElementById("studentsContainer");
        const seatArea = document.getElementById("seatArea"); // 获取座位区域
        let draggedEl = null;

        // 初始化座位表
        function initTable() {
            seatTable.innerHTML = "";
            for (let r = 0; r < 8; r++) {
                const row = seatTable.insertRow();
                for (let c = 0; c < 8; c++) {
                    const cell = row.insertCell();
                    cell.addEventListener("dragover", dragOver);
                    cell.addEventListener("drop", drop);
                    cell.addEventListener("dragleave", dragLeave);
                }
            }
        }

        // 导入学生名单
        function loadStudents(type) {
            const input = type === "male" ? document.getElementById("maleInput").value.trim() : document.getElementById("femaleInput").value.trim();
            const names = input.split("\n").map(n => n.trim()).filter(n => n);

            // 清空对应性别的输入框，避免重复导入
            if (type === "male") {
                document.getElementById("maleInput").value = '';
            } else {
                document.getElementById("femaleInput").value = '';
            }

            names.forEach(name => {
                // 检查是否已存在，如果存在则不重复添加
                if (!Array.from(studentsContainer.children).some(student => student.textContent === name && student.dataset.gender === type)) {
                    addStudent(name, type);
                }
            });
            sortStudentList();
        }

        function addStudent(name, type) {
            const el = document.createElement("div");
            el.className = `student ${type}`; // 直接使用type作为class
            el.textContent = name;
            el.draggable = true;
            el.dataset.gender = type;
            el.addEventListener("dragstart", dragStart);
            el.addEventListener("dragend", dragEnd);
            studentsContainer.appendChild(el);
        }

        // 拖拽事件
        function dragStart(e) {
            draggedEl = e.target;
            // 延迟隐藏，避免拖拽开始时元素立即消失导致视觉不适
            setTimeout(() => {
                if (draggedEl) draggedEl.style.display = "none";
            }, 0);
        }
        function dragEnd(e) {
            if (draggedEl) {
                draggedEl.style.display = "block";
                draggedEl = null;
            }
        }
        function dragOver(e) {
            e.preventDefault();
            e.target.classList.add("drag-over");
        }
        function dragLeave(e) {
            e.target.classList.remove("drag-over");
        }
        function drop(e) {
            e.preventDefault();
            e.target.classList.remove("drag-over");
            if (!draggedEl) return;

            // 如果目标座位已有学生，则将该学生放回未排座位列表
            if (e.target.textContent.trim() !== "") {
                const existingName = e.target.textContent.trim();
                const existingGender = e.target.dataset.gender;
                addStudent(existingName, existingGender);
                sortStudentList();
            }

            // 将拖拽的学生放入目标座位
            e.target.textContent = draggedEl.textContent;
            e.target.dataset.gender = draggedEl.dataset.gender;
            e.target.style.backgroundColor = draggedEl.dataset.gender === "male" ? "#add8e6" : "#f6c1c1";
            draggedEl.remove(); // 从未排座位列表移除已排学生
        }

        function sortStudentList() {
            const students = Array.from(studentsContainer.children);
            students.sort((a, b) => {
                const numA = parseInt(a.textContent.split(" ")[0]) || 0; // 考虑没有数字前缀的情况
                const numB = parseInt(b.textContent.split(" ")[0]) || 0;
                return numA - numB;
            });
            students.forEach(el => studentsContainer.appendChild(el));
        }

        // 清空座位表
        function clearSeats() {
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const cell = seatTable.rows[r].cells[c];
                    if (cell.textContent.trim() !== "") { // 将座位上的学生放回名单
                        addStudent(cell.textContent.trim(), cell.dataset.gender);
                    }
                    cell.textContent = "";
                    cell.style.backgroundColor = "#f0efeb";
                    delete cell.dataset.gender;
                }
            }
            sortStudentList();
        }

        // 清空学生名单
        function clearStudents() {
            studentsContainer.innerHTML = "";
            document.getElementById("maleInput").value = '';
            document.getElementById("femaleInput").value = '';
        }

        // 导出表格
        function exportSeats() {
            let rows = [];
            for (let r = 0; r < seatTable.rows.length; r++) {
                let cols = [];
                for (let c = 0; c < seatTable.rows[r].cells.length; c++) {
                    cols.push(seatTable.rows[r].cells[c].textContent.trim() || "");
                }
                rows.push(cols.join("\t"));
            }
            outputArea.value = rows.join("\n");
        }

        // 保存/加载 座位表
        function saveSeats() {
            const data = [];
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const cell = seatTable.rows[r].cells[c];
                    if (cell.textContent.trim()) {
                        data.push({ row: r, col: c, name: cell.textContent.trim(), gender: cell.dataset.gender });
                    }
                }
            }
            const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "seats.json";
            a.click();
        }
        function loadSeats() {
            const input = document.createElement("input");
            input.type = "file";
            input.accept = ".json";
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    clearSeats(); // 先清空现有座位
                    try {
                        const data = JSON.parse(reader.result);
                        data.forEach(item => {
                            const cell = seatTable.rows[item.row].cells[item.col];
                            cell.textContent = item.name;
                            cell.dataset.gender = item.gender;
                            cell.style.backgroundColor = item.gender === "male" ? "#add8e6" : "#f6c1c1";
                        });
                    } catch (error) {
                        alert("加载座位表文件失败，请检查文件格式。");
                        console.error("Error loading seats:", error);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // 保存/加载 学生名单
        function saveStudents() {
            const names = Array.from(studentsContainer.children).map(el => ({ name: el.textContent, gender: el.dataset.gender }));
            const blob = new Blob([JSON.stringify(names)], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "students.json";
            a.click();
        }
        function loadStudentsFile() {
            const input = document.createElement("input");
            input.type = "file";
            input.accept = ".json";
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    clearStudents(); // 先清空现有学生名单
                    try {
                        const data = JSON.parse(reader.result);
                        data.forEach(item => addStudent(item.name, item.gender));
                        sortStudentList();
                    } catch (error) {
                        alert("加载学生名单文件失败，请检查文件格式。");
                        console.error("Error loading students:", error);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // 导出 PNG 图片
        function exportPNG() {
            const now = new Date();
            const dateStr = `${now.getFullYear()}年${(now.getMonth() + 1).toString().padStart(2, '0')}月${now.getDate().toString().padStart(2, '0')}日`;

            // 创建一个临时的、只包含导出内容的容器
            const exportTempContainer = document.createElement('div');
            exportTempContainer.className = 'export-temp-container'; // 使用定义好的样式

            // 添加标题
            const title = document.createElement('div');
            title.className = 'export-title';
            title.textContent = `座位表 ${dateStr}`;
            exportTempContainer.appendChild(title);

            // 克隆座位表和讲台，避免直接操作DOM影响布局
            const tableClone = seatTable.cloneNode(true);
            exportTempContainer.appendChild(tableClone);

            const podiumClone = document.querySelector('.podium').cloneNode(true);
            exportTempContainer.appendChild(podiumClone);

            // 临时添加到DOM，使其能被html2canvas渲染
            document.body.appendChild(exportTempContainer);

            html2canvas(exportTempContainer, {
                scale: 2, // 提高分辨率，使图片更清晰
                logging: false, // 关闭html2canvas的日志，保持控制台清洁
                useCORS: true // 如果有外部资源（如图片），可能需要
            }).then(canvas => {
                // 截图完成后，从DOM中移除临时容器
                document.body.removeChild(exportTempContainer);

                const a = document.createElement("a");
                a.href = canvas.toDataURL("image/png");
                a.download = `座位表_${dateStr}.png`;
                a.click();
            }).catch(error => {
                console.error("导出PNG失败:", error);
                alert("导出图片失败，请稍后再试。");
                // 确保在出错时也移除临时容器
                if (document.body.contains(exportTempContainer)) {
                    document.body.removeChild(exportTempContainer);
                }
            });
        }

        // 初始化
        initTable();
    </script>
</body>
</html>
